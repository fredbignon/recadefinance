# ============================================================
# Récade Finance : sources de veille automatisée
# ============================================================
# Périmètre : économie, finance classique, finance climatique et
# durabilité, data et intelligence artificielle, au Bénin et en
# Afrique de l'Ouest. La politique est volontairement écartée.
#
# Les adresses ci-dessous ont été testées le 22 novembre 2026.
# Chaque source a une adresse de flux RSS valide. Options :
#   type: agenda        toutes les entrées sont retenues et signalées
#                       comme événements à vérifier
#   exiger_zone: true   l'article doit aussi citer une zone ou une
#                       institution d'Afrique de l'Ouest (liste "zone")
#   theme_dans_titre: true   un mot d'un thème doit figurer dans le titre
#                       (pour les médias généralistes, plus bruyants)
#   poids               indicatif, non utilisé pour le tri pour l'instant

sources:
  - name: "Financial Afrik"
    rss_url: "https://www.financialafrik.com/feed/"
    poids: 1.0

  - name: "Financial Afrik, agenda"
    rss_url: "https://www.financialafrik.com/agenda/feed/"
    type: agenda
    poids: 1.0

  # Les anciennes adresses d'Agence Ecofin (finance/rss, gouvernance-economique/rss)
  # ne répondaient plus : le site a changé de système. Ce flux général est à jour.
  - name: "Agence Ecofin"
    rss_url: "https://www.agenceecofin.com/component/obrss/agence-large-rss"
    exiger_zone: true
    poids: 1.0

  - name: "Digital Mag (Côte d'Ivoire)"
    rss_url: "https://digitalmag.ci/feed/"
    exiger_zone: true
    poids: 0.8

  - name: "TechCabal"
    rss_url: "https://techcabal.com/fr/feed/"
    exiger_zone: true
    poids: 0.8

  # Médias généralistes du Bénin : seuls les articles qui touchent aux thèmes
  # ci-dessous remontent.
  - name: "Bénin Web TV"
    rss_url: "https://beninwebtv.bj/feed/"
    exiger_zone: true
    theme_dans_titre: true
    poids: 0.6

  - name: "La Nouvelle Tribune"
    rss_url: "https://lanouvelletribune.info/feed/"
    exiger_zone: true
    theme_dans_titre: true
    poids: 0.6

  # À suivre à la main (pas de flux RSS public trouvé) : communiqués de la BCEAO
  # (bceao.int/fr/communique-presse), BRVM, UMOA-Titres, Alliance Fintech UEMOA,
  # Banque mondiale, sites des ministères. La CAGD (cagd.bj) bloque l'accès
  # automatisé. Pas de flux dédié à la finance climatique : elle est repérée par
  # mots-clés dans les flux ci-dessus.

