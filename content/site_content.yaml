  success_message: "Merci ! Votre demande est bien enregistrée. Nous revenons vers vous par email avec votre accès au pilote."
  disclaimer: "L'Assistant réglementaire UMOA est un outil d'aide à la lecture des textes. Il ne remplace ni un avis de la BCEAO ou de la Commission Bancaire, ni la validation de vos équipes."

