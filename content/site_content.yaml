about_page:
  intro_quote: "La récade — du portugais recado, « message » — était le sceptre remis par les rois du Dahomey à leurs messagers pour authentifier leur parole auprès de son destinataire. Récade Finance porte cette même exigence : une parole économique sourcée, vérifiable, qui ne se contente jamais d'un chiffre brut."
  paragraph_1: "Récade Finance est un espace de veille et de vulgarisation consacré à trois sujets qui se recoupent de plus en plus : la finance bancaire et réglementaire, la dette souveraine, et l'intelligence artificielle appliquée à ces domaines — regardés depuis et pour l'Afrique."
  paragraph_2: "Ce n'est pas un simple relais d'actualité. C'est un agora où chaque article et publication se veut être un véhicule d'analyse, de transmission et de partage de connaissances techniques sur les sujets phares ayant trait à l'économie, la finance et l'IA — vu du continent africain, spécialement la zone ouest africaine."
  paragraph_3: "Récade Finance se veut être aussi un contributeur à l'essor et la promotion de profils inspirants de professionnels africains de la finance évoluant en Afrique et dans le monde."
  disclaimer: "Récade Finance est un blog d'analyse et de veille économique et financière sur le continent africain. Il ne sollicite aucun investissement, ne gère aucun fonds et ne propose aucun produit ou service financier. Le contenu publié est fourni à titre informatif et ne constitue pas un conseil en investissement."

site_disclaimer_short: "Blog d'analyse et de veille économique et financière — aucune sollicitation d'investissement, aucune gestion de fonds."
