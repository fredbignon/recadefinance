about_page:
  intro_quote: "Au Dahomey, le messager d'un roi portait une récade. Le mot vient du portugais recado, le message. Cet objet disait d'où venait la parole : celui qui la recevait savait qui l'envoyait et pouvait la croire. Récade Finance se donne la même règle pour l'information économique et financière : dire d'où vient chaque chiffre, citer ses sources, indiquer ses limites."
  paragraph_1: "Récade Finance est un espace de veille et de vulgarisation sur trois sujets de plus en plus liés : la finance, y compris la finance climatique, l'économie, en l'occurrence la dette et la notation souveraine, et l'intelligence artificielle appliquée à ces domaines. Il les regarde depuis l'Afrique et pour elle."
  paragraph_2: "Au-delà de la vulgarisation et d'une lucarne d'apports de solutions, Récade Finance veut aussi être une tribune permettant de faire connaître des professionnels africains de la finance et de l'économie, qu'ils exercent en Afrique ou ailleurs dans le monde."
  disclaimer: "Récade Finance est un blog d'analyse et de veille économique et financière sur le continent africain. Il ne sollicite aucun investissement, ne gère aucun fonds et ne propose aucun produit ou service financier. Le contenu publié est fourni à titre informatif et ne constitue pas un conseil en investissement."

site_disclaimer_short: "Blog d'analyse et de veille économique et financière. Aucune sollicitation d'investissement, aucune gestion de fonds."

