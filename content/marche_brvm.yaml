# ============================================================
# Récade Finance : données du marché BRVM
# ============================================================
# Rubrique désaffichée du site pour le moment. Les données restent ici.
# Pour la réafficher : passer "brvm" à True dans SECTIONS_ACTIVES (scripts/build.py).
#
# À mettre à jour manuellement, idéalement chaque jour ouvré,
# à partir des chiffres officiels publiés sur brvm.org (sections
# "Indices" et "Résumé") ou d'un agrégateur fiable (par exemple
# Sika Finance ou brvmscreener.com).
#
# La variation s'écrit avec son signe ("+0,02 %" ou "-0,15 %").
# Le champ "sens" n'est plus utilisé pour l'affichage.
#
# Après modification : python3 scripts/build.py puis git push
# (ou laisser l'automatisation GitHub Actions s'en charger si le
# fichier est modifié directement sur GitHub).

date_cloture: "28 août 2026"

# Indicateurs clés : résument le marché en un coup d'œil
indices:
  - nom: "BRVM Composite"
    valeur: "530,06"
    variation: "+0,02 %"
    sens: "hausse"

  - nom: "BRVM 30"
    valeur: "256,35"
    variation: "+0,19 %"
    sens: "hausse"

# Indicateurs détaillés : donnent une lecture plus fine de la
# même séance (respiration du marché, activité, taille)
indicateurs_desagreges:
  - label: "Avance et déclin"
    valeur: "17 en hausse, 22 en baisse, 8 inchangées"
    detail: "sur 47 valeurs cotées"

  - label: "Volume échangé"
    valeur: "732 946 titres"
    detail: "2,4 Md FCFA sur la séance"

  - label: "Capitalisation boursière"
    valeur: "19 803 Md FCFA"
    detail: "45 sociétés valorisées sur 47"

source_label: "Cours officiels de clôture. Source : BRVM (brvm.org)"

# Interprétation courte, à réécrire à chaque mise à jour des chiffres
# ci-dessus. Une lecture automatisée n'est pas possible ici : elle demande
# un vrai regard sur ce que les chiffres du jour signifient.
interpretation: "Une séance de faible amplitude en surface, mais plus contrastée en profondeur : malgré la légère hausse du Composite (+0,02 %), 22 valeurs reculent contre seulement 17 qui progressent. La performance de l'indice tient donc à quelques poids lourds plutôt qu'à un mouvement de marché généralisé. Le chiffre agrégé seul ne montre pas cette nuance."
